# k3s deployment of a self-hosted DERP relay + STUN server for go-gost p2p.
#
# TLS is terminated by Traefik (k3s's bundled ingress controller) via a
# standard Ingress; derper itself runs plain HTTP/WS (no TLS). WebSocket is
# forwarded by Traefik natively — the DERP 30s keepalive keeps the long-lived
# connection through any idle timeout.
#
# Before applying:
#   1. Image is gogost/derper (built by the derper repo's GitHub Actions);
#      pin the tag to the derper version you want.
#   2. Replace every derp.example.com with your real public hostname.
#
# No cert secret is managed here: the Ingress tls block carries no
# secretName, so Traefik serves its bundled default certificate — a
# self-signed one that does not match the public hostname. p2p hosts must
# skip verification against it:
#     ./p2p --derp wss://derp.example.com/derp --tls.secure=false ...
# (or --tls.caFile <traefik-default-cert> when that cert's SAN matches the
# hostname — otherwise hostname verification still fails).
#
# p2p hosts then connect with:  --derp wss://derp.example.com/derp
#
# SECURITY: -verify-clients=false makes this an OPEN relay: anyone who knows
# the address can relay through it. That is required by the p2p design (the
# hosts authenticate out-of-band by public key, not against the relay). The
# relay can observe and drop but cannot decrypt traffic — confidentiality is
# the inner dialer's (tls/mtls/wss) job.
---
apiVersion: v1
kind: Namespace
metadata:
  name: derp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: derper
  namespace: derp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: derper
  template:
    metadata:
      labels:
        app: derper
    spec:
      containers:
        - name: derper
          image: gogost/derper:1.102.3
          args:
            # Explicit IPv4 bind; -a is NOT :443 and -certmode is not manual,
            # so derper serves plain HTTP/WS (serveTLS=false) — no cert needed.
            - -a=0.0.0.0:8443
            - -stun=true
            - -stun-port=3478
            # Open relay: required so p2p hosts connect without a registered
            # Tailscale node / mesh key.
            - -verify-clients=false
          ports:
            - name: http-derp
              containerPort: 8443
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Backend service for Traefik (plain HTTP DERP). ClusterIP only — external
# HTTPS is handled by the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: derper
  namespace: derp
spec:
  type: ClusterIP
  selector:
    app: derper
  ports:
    - name: http-derp
      port: 8443
      targetPort: 8443
      protocol: TCP
---
# STUN must bypass Traefik (it is UDP); expose it directly. LoadBalancer uses
# k3s's built-in servicelb — swap to NodePort/MetalLB as needed.
apiVersion: v1
kind: Service
metadata:
  name: derper-stun
  namespace: derp
spec:
  type: LoadBalancer
  selector:
    app: derper
  ports:
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: derper
  namespace: derp
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - derp.example.com # no secretName → Traefik's default self-signed cert
  rules:
    - host: derp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: derper
                port:
                  number: 8443
