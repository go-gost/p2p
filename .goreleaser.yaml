# p2p 多平台二进制发布配置。
# 参考 gost 的 .goreleaser.yaml，但 p2p 是轻量单二进制，目标平台取核心子集。

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
      - GOWORK=off # 本地在 go.work 里，独立构建必须关掉
    main: .
    targets:
      - linux_386
      - linux_amd64
      - linux_arm_6
      - linux_arm_7
      - linux_arm64
      - windows_386
      - windows_amd64
      - windows_arm64
      - darwin_amd64
      - darwin_arm64
    ldflags:
      - "-s -w"

archives:
  - format: tar.gz
    # Windows 用 zip，保持与 gost 一致
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
  mode: keep-existing
